<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Einbürgerungstest Study Lab</title>
    <meta name="description" content="Bilingual German Citizenship Test (Leben in Deutschland / Einbürgerungstest) preparation app with official BAMF questions, image questions, practice mode, and mock exams." />
    
    <!-- PWA & Mobile Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f1e6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Testtrainer DE" />
    
    <!-- iOS / Safari Home Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Testtrainer DE" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png" />
    <script>
      // Support window.fetch assignment in sandboxed / iframe environments where it's read-only
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          // Try to define on Window.prototype if it exists and fetch is there, otherwise fallback to window
          var target = window;
          if (typeof Window !== 'undefined' && Window.prototype && ('fetch' in Window.prototype)) {
            target = Window.prototype;
          }
          Object.defineProperty(target, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Unable to define configurable window.fetch:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
