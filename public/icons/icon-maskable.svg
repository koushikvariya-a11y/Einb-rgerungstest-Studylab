<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Bleed Background for Masking -->
  <rect width="512" height="512" fill="#1d4ed8"/>
  <!-- Decorative Bauhaus Shapes inside safe area -->
  <circle cx="440" cy="80" r="140" fill="#dc2626"/>
  <rect x="-40" y="360" width="220" height="220" fill="#f4b400" transform="rotate(15, 70, 470)"/>
  <!-- Central Badge -->
  <rect x="106" y="106" width="300" height="300" rx="28" fill="#111111"/>
  <rect x="96" y="96" width="300" height="300" rx="24" fill="#f6f1e6" stroke="#111111" stroke-width="20"/>
  <!-- Yellow Accent -->
  <rect x="330" y="76" width="80" height="80" rx="6" fill="#f4b400" stroke="#111111" stroke-width="16"/>
  <!-- Text -->
  <text x="240" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="160" font-weight="950" fill="#111111" text-anchor="middle" letter-spacing="-5">DE</text>
